# FULL EVALUATION CONFIG - Main Session Data
# Disables risk controls to see ALL trades and identify what works
# This is for ANALYSIS only, not live trading

data:
  filepath: "data/dax_2019_5m_main_session.csv"
  date_column: "Datetime"
  ohlcv_columns:
    open: "Open"
    high: "High"
    low: "Low"
    close: "Close"
    volume: "Volume"
  timeframe: "5min"

session:
  start_time: "06:00"
  end_time: "21:00"
  entry_cutoff: "18:00"
  exit_buffer: 30
  skip_first_minutes: 10

strategy:
  # Same optimized parameters
  adx_period: 14
  adx_momentum_threshold: 20
  adx_ranging_threshold: 25

  fast_ma_period: 20
  slow_ma_period: 50
  regime_ma_period: 20

  momentum:
    rsi_period: 14
    rsi_min: 45
    breakout_lookback: 10
    volume_ma_period: 30
    atr_expansion_threshold: 1.1
    atr_expansion_period: 50

  mean_reversion:
    rsi2_period: 2
    rsi2_oversold: 20
    rsi2_overbought: 80
    bb_period: 20
    bb_std: 1.5
    rsi_divergence_period: 14
    require_confirmation_candle: false

  # SMALLER POSITION SIZE (so we can take all trades)
  risk:
    risk_per_trade_pct: 0.5  # Reduced from 0.75
    momentum_stop_atr_mult: 1.8
    mean_reversion_stop_atr_mult: 1.3
    atr_period: 14

    momentum_tp1_r: 1.8
    momentum_tp2_r: 2.5
    mean_reversion_tp_r: 1.3
    partial_exit_pct: 0.5

    trailing_atr_mult: 1.3
    min_profit_lock_r: 1.0

  volatility:
    atr_zscore_threshold: 3.0
    atr_zscore_period: 100
    vix_high: 35
    vix_extreme: 50
    reduce_size_factor: 0.75

  # DISABLE RISK CONTROLS (for analysis)
  controls:
    max_consecutive_losses: 999  # Effectively disabled
    daily_loss_limit_pct: 100.0  # Effectively disabled
    max_positions: 1

backtest:
  initial_capital: 100000
  currency: "EUR"
  point_value: 1.0
  commission_per_contract: 2.50
  slippage_atr_mult: 0.4

output:
  trade_log_path: "results/trade_log.csv"
  equity_curve_path: "results/equity_curve.csv"
  performance_report_path: "results/performance_report.txt"
  plot_equity_curve: true
  plot_drawdown: true
  plot_monthly_returns: true
