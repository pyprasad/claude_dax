# Adaptive Regime Intraday (ARI) Strategy Configuration

# Data Settings
data:
  filepath: "data/DAX_5min_realistic.csv"  # Path to OHLCV data
  date_column: "timestamp"
  ohlcv_columns:
    open: "open"
    high: "high"
    low: "low"
    close: "close"
    volume: "volume"
  timeframe: "5min"

# Trading Session (for DAX - adjust per index)
session:
  start_time: "09:00"
  end_time: "22:00"
  entry_cutoff: "16:00"  # No new entries after this time
  exit_buffer: 30  # Minutes before session end to close all positions
  skip_first_minutes: 15  # Skip first N minutes of session

# Strategy Parameters
strategy:
  # Regime Detection
  adx_period: 14
  adx_momentum_threshold: 25  # Above = momentum mode
  adx_ranging_threshold: 20   # Below = mean-reversion mode

  # Trend Filters
  fast_ma_period: 50
  slow_ma_period: 200
  regime_ma_period: 50  # For 15min chart

  # Momentum Entry
  momentum:
    rsi_period: 14
    rsi_min: 50  # RSI must be above this for long momentum
    breakout_lookback: 20  # Bars to look back for high/low
    volume_ma_period: 20
    atr_expansion_threshold: 1.2  # ATR must be X times rolling ATR
    atr_expansion_period: 50

  # Mean-Reversion Entry
  mean_reversion:
    rsi2_period: 2
    rsi2_oversold: 10
    rsi2_overbought: 90
    bb_period: 20
    bb_std: 2.0
    rsi_divergence_period: 14
    require_confirmation_candle: true

  # Risk Management
  risk:
    risk_per_trade_pct: 1.0  # % of account equity
    momentum_stop_atr_mult: 2.0
    mean_reversion_stop_atr_mult: 1.5
    atr_period: 14

    # Take Profit
    momentum_tp1_r: 2.0  # Risk-reward ratio
    momentum_tp2_r: 3.0
    mean_reversion_tp_r: 1.5
    partial_exit_pct: 0.5  # Exit 50% at TP1

    # Trailing Stop
    trailing_atr_mult: 1.5
    min_profit_lock_r: 1.5  # Minimum profit to lock after TP1

  # Volatility Filters
  volatility:
    atr_zscore_threshold: 2.5  # No entries if ATR Z-score above this
    atr_zscore_period: 100
    vix_high: 30  # Reduce position size
    vix_extreme: 40  # No trading
    reduce_size_factor: 0.5  # Multiply position size by this when VIX high

  # Risk Controls
  controls:
    max_consecutive_losses: 3
    daily_loss_limit_pct: 2.0  # % of starting equity
    max_positions: 1

# Backtest Settings
backtest:
  initial_capital: 100000
  currency: "EUR"
  point_value: 1.0  # Value per point (1 for mini DAX)
  commission_per_contract: 2.50  # Per side
  slippage_atr_mult: 0.5  # Slippage as multiple of 1-bar ATR

# Output Settings
output:
  trade_log_path: "results/trade_log.csv"
  equity_curve_path: "results/equity_curve.csv"
  performance_report_path: "results/performance_report.txt"
  plot_equity_curve: true
  plot_drawdown: true
  plot_monthly_returns: true
